[package]
name    = "adder-fmu-rust-runner"
version = "0.1.0"
edition = "2021"
description = "Host runner that exercises the adder-rust-fmu Wasm component via wasmtime"

[[bin]]
name = "adder-fmu-rust-runner"
path = "src/main.rs"

[dependencies]
# Component-model host runtime.
wasmtime      = { version = "46", features = ["async", "component-model", "component-model-async"] }
wasmtime-wasi = { version = "46", features = ["p3"] }
tokio         = { version = "1", features = ["macros", "rt-multi-thread"] }
anyhow        = "1"
roxmltree     = "0.20"
# FMU archive unpacking
zip      = "2"
tempfile = "3"
